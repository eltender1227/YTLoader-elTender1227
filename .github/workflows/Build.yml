name: Compilar APK de Android

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Esto te permite ejecutarlo manualmente desde la pestaña "Actions"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Descarga el código de tu repositorio
    - name: 🤖 Descargar repositorio
      uses: actions/checkout@v4

    # 2. Configura el entorno de Java (necesario para compilar Android)
    - name: ☕ Configurar Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # 3. Configura el SDK de Android para que Gradle pueda compilar
    - name: 📱 Configurar Android SDK
      uses: android-actions/setup-android@v3

    # 4. Da permisos de ejecución al archivo gradleW
    - name: 🔑 Dar permisos a Gradle
      run: chmod +x gradlew

    # 5. Ejecuta la compilación del APK (versión de pruebas / Debug)
    - name: ⚙️ Compilar APK (Debug)
      run: ./gradlew assembleDebug

    # 6. Sube el APK generado como artefacto para que puedas descargarlo
    - name: 📦 Guardar APK generado
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
