name: Compilar APK de Android

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 🤖 Descargar repositorio
      uses: actions/checkout@v4

    - name: ☕ Configurar Java JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 🔑 Dar permisos a Gradle
      run: |
        if [ -f "gradlew" ]; then
          chmod +x gradlew
        elif [ -f "app/gradlew" ]; then
          chmod +x app/gradlew
        fi

    - name: ⚙️ Compilar APK (Debug)
      run: |
        if [ -f "gradlew" ]; then
          ./gradlew assembleDebug --no-daemon
        else
          cd app && ./gradlew assembleDebug --no-daemon
        fi

    - name: 📦 Guardar APK generado
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: '**/build/outputs/apk/debug/app-debug.apk'
