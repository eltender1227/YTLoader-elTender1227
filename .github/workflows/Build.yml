name: Compilar APK de Android

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: 🤖 Descargar repositorio
      uses: actions/checkout@v4

    - name: 📥 Descargar ZIP desde GitHub Releases (Opcional)
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release download --pattern "*.zip" --repo ${{ github.repository }} || true
        if ls *.zip 1> /dev/null 2>&1; then
          unzip -q "*.zip" -d proyecto_extraido
          echo "✅ ZIP descomprimido."
        fi

    - name: ☕ Configurar Java JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: ⚙️ Compilar APK (Búsqueda y Generación Automática)
      run: |
        # Buscar dónde está el archivo build.gradle en el proyecto
        BUILD_FILE=$(find . -name "build.gradle" -o -name "build.gradle.kts" -print -quit)
        
        if [ -z "$BUILD_FILE" ]; then
          echo "❌ No se encontró ningún archivo build.gradle en el repositorio o release."
          exit 1
        fi
        
        DIR_PATH=$(dirname "$BUILD_FILE")
        echo "📂 Proyecto localizado en la carpeta: $DIR_PATH"
        cd "$DIR_PATH"
        
        # Si no existe gradlew, instalar gradle temporalmente y crearlo
        if [ ! -f "gradlew" ]; then
          echo "⚠️ No se encontró gradlew. Generando wrapper automáticamente..."
          sudo apt-get update && sudo apt-get install -y gradle
          gradle wrapper
        fi
        
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

    - name: 📦 Guardar APK generado
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: '**/build/outputs/apk/debug/app-debug.apk'
