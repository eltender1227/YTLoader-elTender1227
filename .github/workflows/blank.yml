name: Android Build Directo

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Clonar repositorio
      uses: actions/checkout@v4

    - name: ☕ Configurar Java 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: ⚙️ Instalar Gradle y Compilar
      run: |
        sudo apt-get update
        sudo apt-get install -y gradle

        # Buscar de forma inteligente la carpeta del proyecto Android
        PROJECT_DIR=""
        if [ -f "build.gradle" ] || [ -f "build.gradle.kts" ]; then
          PROJECT_DIR="."
        else
          # Buscar la primera carpeta que contenga un build.gradle
          FOUND_FILE=$(find . -name "build.gradle" -o -name "build.gradle.kts" -print -quit)
          if [ -n "$FOUND_FILE" ]; then
            PROJECT_DIR=$(dirname "$FOUND_FILE")
          fi
        fi

        if [ -z "$PROJECT_DIR" ]; then
          echo "❌ No se encontró ningún archivo build.gradle en el repositorio."
          exit 1
        fi

        echo "📂 Entrando al directorio del proyecto: $PROJECT_DIR"
        cd "$PROJECT_DIR"
        
        # Compilar usando gradle directamente
        gradle assembleDebug --no-daemon

    - name: 📦 Guardar APK
      uses: actions/upload-artifact@v4
      with:
        name: mi-apk-debug
        path: '**/build/outputs/apk/debug/*.apk'

