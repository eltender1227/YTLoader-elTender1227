name: Android Build Directo

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Clonar repositorio
      uses: actions/checkout@v4

    - name: ☕ Configurar Java 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: ⚙️ Instalar Gradle y Compilar
      run: |
        # Actualizar e instalar gradle directamente en el servidor
        sudo apt-get update
        sudo apt-get install -y gradle
        
        # Buscar el archivo de configuración y compilar
        if [ -f "build.gradle" ] || [ -f "build.gradle.kts" ]; then
          gradle assembleDebug --no-daemon
        else
          # Si está dentro de una subcarpeta, la busca y compila ahí
          DIR=$(find . -name "build.gradle" -o -name "build.gradle.kts" -print -quit | xargs dirname)
          cd "$DIR"
          gradle assembleDebug --no-daemon
        fi

    - name: 📦 Guardar APK
      uses: actions/upload-artifact@v4
      with:
        name: mi-apk-debug
        path: '**/build/outputs/apk/debug/*.apk'
